# 8G heap + 4G metaspace asks a 14 GB machine for 12 GB of JVM before anything
# else runs. With an IDE open the daemon is killed by the OOM killer during
# startup, which produces an empty log and a bare non-zero exit — indistinguish-
# able from a compile error, and sending whoever reads it into the Gradle
# config instead of the memory. These numbers build this app with room to spare.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Leave this false. Flutter's Gradle plugin loader applies `kotlin-android` to
# every plugin subproject itself, which is what compiles the Kotlin in plugins
# that do not carry their own Kotlin setup (firebase_core, package_info_plus on
# AGP 9). Turning built-in Kotlin on does not replace that — it collides with
# it, and the build dies during configuration on whichever plugin is evaluated
# first, naming a package that has nothing wrong with it.
android.builtInKotlin=false
